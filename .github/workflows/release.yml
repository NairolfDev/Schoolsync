name: Release

# Ein Tag wie v1.0.0 pushen -> Tests laufen, schulsync.exe wird gebaut und als Release veröffentlicht.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux-Abhängigkeiten und Tests
        run: |
          python -m pip install -e '.[dev,build]' build
          python -m pytest -p no:cacheprovider -q tests/test_linux_secrets.py tests/test_linux_autostart.py tests/test_linux_desktop.py tests/test_linux_package.py tests/test_linux_systemd_verify.py
      - name: AppImage und Python-Paket bauen
        run: bash scripts/build_linux.sh
      - name: Linux-Artefakte für Release bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: schulsync-linux
          path: |
            dist/SchulSync-x86_64.AppImage
            dist/SchulSync-x86_64.AppImage.sha256
            dist/SchulSync-Linux-x86_64.tar.gz
            dist/SchulSync-Linux-x86_64.tar.gz.sha256
            dist/python/*
          if-no-files-found: error

  release:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version muss zum Tag passen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path src\schulsync\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zur Version $v in src/schulsync/__init__.py" }
      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -p no:cacheprovider -q
      - name: Bauen
        shell: pwsh
        run: powershell -File scripts\build_exe.ps1
      - uses: actions/download-artifact@v4
        with:
          name: schulsync-linux
          path: linux-release
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $linux = Get-ChildItem linux-release -File -Recurse | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" dist\SchulSync-Setup.exe dist\SchulSync-Setup.exe.sha256 @linux --title "SchulSync ${{ github.ref_name }}" --generate-notes

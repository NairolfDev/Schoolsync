name: Release

# Ein Tag wie v1.0.0 pushen -> Tests laufen, schulsync.exe wird gebaut und als Release veröffentlicht.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version muss zum Tag passen
        shell: pwsh
        run: |
          $v = (Select-String -Path src\schulsync\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zur Version $v in src/schulsync/__init__.py" }
      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -p no:cacheprovider -q
      - name: Bauen
        shell: pwsh
        run: powershell -File scripts\build_exe.ps1
      - name: Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\SchulSync-Setup.exe dist\SchulSync-Setup.exe.sha256 --title "SchulSync ${{ github.ref_name }}" --generate-notes
